syntax = "proto3";

package payment.models.v1;

option csharp_namespace = "Payment.Common.Grpc";

enum OwnerRole {
  OWNER_ROLE_UNSPECIFIED = 0;
  OWNER_ROLE_PRIMARY = 1;
  OWNER_ROLE_SECONDARY = 2;
  OWNER_ROLE_AUTHORIZED_USER = 3;
  OWNER_ROLE_VIEW_ONLY = 4;
}

enum WalletStatus {
  WALLET_STATUS_UNSPECIFIED = 0;
  WALLET_STATUS_UNVERIFIED = 1;
  WALLET_STATUS_ACTIVE = 2;
  WALLET_STATUS_SUSPENDED = 3;
  WALLET_STATUS_CLOSED = 4;
  WALLET_STATUS_FROZEN = 5;
  WALLET_STATUS_PENDING_CLOSURE = 6;
}

enum WalletType {
  WALLET_TYPE_UNSPECIFIED = 0;
  WALLET_TYPE_PERSONAL = 1;
  WALLET_TYPE_BUSINESS = 2;
  WALLET_TYPE_SAVINGS = 3;
  WALLET_TYPE_INVESTMENT = 4;
  WALLET_TYPE_ESCROW = 5;
  WALLET_TYPE_MULTI_CURRENCY = 6;
}

enum Currency {
  CURRENCY_UNSPECIFIED = 0;
  CURRENCY_USD = 1;
  CURRENCY_EUR = 2;
  CURRENCY_GBP = 3;
  CURRENCY_PLN = 4;
  CURRENCY_JPY = 5;
  CURRENCY_CHF = 6;
  CURRENCY_CAD = 7;
  CURRENCY_AUD = 8;
}
